name: lk_markets
version: "0.2.0"
profile: lk_markets

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Currencies to report LKR rates against (the API returns ~166; we keep these).
  fx_currencies: [USD, EUR, GBP, INR, JPY, AUD, CNY, AED, SGD]

models:
  lk_markets:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  lk_markets:
    +schema: reference
    cse_watchlist:
      +column_types:
        is_jkh_group: boolean
